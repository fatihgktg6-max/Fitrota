name: FitRota Android Test

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: ZIP filename
        required: true
        default: FitRota-0623-AdMob.zip

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check build tools
        run: |
          java -version
          node --version
          sdkmanager --version

      - name: Extract ZIP
        env:
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          test -f "$ZIP_FILE"
          python3 -m zipfile -e "$ZIP_FILE" fitrota-build
          test -f fitrota-build/package.json
          test -f fitrota-build/android/gradlew

      - name: Build and sync
        working-directory: fitrota-build
        run: |
          npm ci --include=dev
          npm run test:admob
          npm run build:us
          npx cap sync android

      - name: Build APK and AAB
        working-directory: fitrota-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: FitRota-Android-Test
          if-no-files-found: error
          retention-days: 14
          path: |
            fitrota-build/android/app/build/outputs/apk/debug/*.apk
            fitrota-build/android/app/build/outputs/bundle/release/*.aab
